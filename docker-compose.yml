services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pgqueue
      POSTGRES_PASSWORD: pgqueue
      POSTGRES_DB: pgqueue
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgqueue"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    command: ["/usr/local/bin/pgqueue"]
    environment:
      DATABASE_URL: postgres://pgqueue:pgqueue@postgres:5432/pgqueue?sslmode=disable
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build: .
    command: ["/usr/local/bin/demo-worker"]
    environment:
      DATABASE_URL: postgres://pgqueue:pgqueue@postgres:5432/pgqueue?sslmode=disable
      CONCURRENCY: "8"
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]
    depends_on: [api, worker]
